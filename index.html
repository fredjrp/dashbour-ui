<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FredBot Agent Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="header">
    <h1>FredBot Agent Dashboard</h1>
    <input type="text" id="agentName" placeholder="Enter your name"/>
    <button onclick="setAgent()">Login</button>
  </div>

  <div class="main">
    <div class="sidebar">
      <h2>Chats</h2>
      <ul id="chatList"></ul>
    </div>

    <div class="chat-area">
      <div id="chatHeader">Select a chat</div>
      <div id="chatBox"></div>
      <textarea id="messageInput" placeholder="Type a message"></textarea>
      <button onclick="sendAgentReply()">Send</button>
      <button onclick="closeChat()">Close Chat</button>
      <button onclick="returnToBot()">Return to Bot</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
