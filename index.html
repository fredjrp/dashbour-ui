<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhatsApp Bot Monitor</title>
  <style>
    body { font-family: Roboto, sans-serif; margin: 0; }
    .app-container { display: flex; height: 100vh; }
    aside.sidebar, aside.user-details { width: 20%; padding: 1em; border-right: 1px solid #ccc; }
    main.chat-container { flex: 1; display: flex; flex-direction: column; }
    .conversation-item.active { background: #e0f7fa; }
    .message { padding: .5em; margin: .3em; border-radius: 5px; max-width: 70%; }
    .message-incoming { background: #f1f1f1; align-self: flex-start; }
    .message-outgoing { background: #c8e6c9; align-self: flex-end; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar: Conversations -->
    <aside class="sidebar">
      <button id="auth-button">Sign In</button>
      <h3>Conversations</h3>
      <div id="conversation-list"></div>
    </aside>

    <!-- Main chat area -->
    <main class="chat-container">
      <div style="padding:1em; border-bottom:1px solid #ccc;">
        <h2 id="current-chat-name">Select a conversation</h2>
        <p id="current-chat-number"></p>
      </div>
      <div id="message-container" style="flex:1; overflow-y:auto; padding:1em;"></div>
      <div id="message-input-container" style="display:none; padding:1em; border-top:1px solid #ccc;">
        <input id="message-input" placeholder="Type a message..." style="width:80%;"/>
        <button id="send-button">Send</button>
      </div>
    </main>

    <!-- User Details -->
    <aside class="user-details">
      <div id="user-details-content" style="display:none;">
        <h4 id="user-name">User</h4>
        <p id="user-phone"></p>
        <p>Last Active: <span id="last-active"></span></p>
        <textarea id="user-notes" placeholder="Add notes..."></textarea>
        <button id="save-notes">Save</button>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
