<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FredBot Agent Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { height: 100vh; }
    .chat-list-item { cursor: pointer; }
    .chat-list-item.active { background-color: #dfefff; }
    #chatBox { height: calc(100vh - 220px); overflow-y: auto; padding: 1rem; background: #f8f9fa; }
    .msg.agent { text-align: right; color: blue; }
    .msg.user { text-align: left; color: black; }
    .timestamp { font-size: 0.75rem; color: gray; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">FredBot Agent Dashboard</span>
    <div class="d-flex">
      <input id="agentName" class="form-control me-2" type="text" placeholder="Agent Name">
      <button class="btn btn-light" onclick="setAgent()">Login</button>
    </div>
  </nav>

  <div class="d-flex">
    <div class="border-end p-3" style="width: 280px;">
      <h5>Chats</h5>
      <ul id="chatList" class="list-group"></ul>
    </div>

    <div class="flex-grow-1 d-flex flex-column">
      <div id="chatHeader" class="p-3 border-bottom">Select a chat</div>
      <div id="chatBox"></div>
      <div class="p-3 border-top">
        <textarea id="messageInput" class="form-control mb-2" rows="2" placeholder="Type a message..." disabled></textarea>
        <div class="d-flex justify-content-end gap-2">
          <button class="btn btn-primary" id="sendBtn" onclick="sendAgentReply()" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const RENDER_BACKEND_URL = 'https://your-render-service.onrender.com'; // replace with your Render URL

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserId = null;
    let currentAgent = null;

    const chatList = document.getElementById('chatList');
    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    function setAgent() {
      const name = document.getElementById('agentName').value.trim();
      if (!name) return alert("Enter your name");
      currentAgent = name;
      document.getElementById('agentName').disabled = true;
      loadChats();
    }

    function loadChats() {
      db.collection('whatsapp_logs')
        .orderBy('timestamp', 'desc')
        .onSnapshot(snapshot => {
          const users = new Set();
          chatList.innerHTML = '';
          snapshot.forEach(doc => {
            const data = doc.data();
            if (data.from && !users.has(data.from)) {
              users.add(data.from);
              const li = document.createElement('li');
              li.className = 'list-group-item chat-list-item';
              li.textContent = data.from;
              li.onclick = () => loadChat(data.from);
              chatList.appendChild(li);
            }
          });
        });
    }

    function loadChat(userId) {
      currentUserId = userId;
      document.getElementById('chatHeader').textContent = `Chat with: ${userId}`;
      messageInput.disabled = false;
      sendBtn.disabled = false;
      chatBox.innerHTML = '';

      db.collection('whatsapp_logs')
        .where('from', '==', userId)
        .orderBy('timestamp')
        .onSnapshot(snapshot => {
          chatBox.innerHTML = '';
          snapshot.forEach(doc => {
            const msg = doc.data();
            const div = document.createElement('div');
            div.className = 'msg user';
            div.innerHTML = `<div>${msg.text?.body || '[No Text]'}</div>
              <div class="timestamp">${new Date(Number(msg.timestamp) * 1000).toLocaleString()}</div>`;
            chatBox.appendChild(div);
          });
          chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    async function sendAgentReply() {
      const text = messageInput.value.trim();
      if (!text || !currentUserId) return;

      try {
        await fetch(`${RENDER_BACKEND_URL}/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to: currentUserId, message: text })
        });
        const div = document.createElement('div');
        div.className = 'msg agent';
        div.innerHTML = `<div>${text}</div><div class="timestamp">${new Date().toLocaleString()}</div>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        messageInput.value = '';
      } catch (err) {
        alert('Failed to send message.');
      }
    }
  </script>
</body>
</html>
